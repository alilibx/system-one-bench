<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>





*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#0c121d;color:#eef2f8;font-family:"IBM Plex Sans";position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(#1d2636 1px,transparent 1px),linear-gradient(90deg,#1d2636 1px,transparent 1px);background-size:60px 60px;opacity:.55}
.glow{position:absolute;width:760px;height:760px;right:-220px;top:-260px;background:radial-gradient(circle,rgba(57,135,229,.28),transparent 62%)}
.in{position:absolute;inset:72px 80px}
.mark{display:flex;align-items:center;gap:16px;font:800 34px "Bricolage Grotesque";letter-spacing:-.01em}
.eyebrow{margin-top:56px;font:600 20px "IBM Plex Sans";letter-spacing:.12em;text-transform:uppercase;color:#5b9ef0}
h1{margin-top:14px;font:700 78px/1.02 "Bricolage Grotesque";letter-spacing:-.03em;max-width:1040px}.sub{margin-top:22px;font:400 26px "IBM Plex Sans";color:#b6bfce}
.chips{position:absolute;left:0;bottom:0;display:flex;gap:12px}
.chip{border:1px solid #263043;background:#131b29;border-radius:999px;padding:10px 20px;font:500 22px "IBM Plex Sans";color:#b6bfce}
.url{position:absolute;right:0;bottom:6px;font:600 24px "IBM Plex Sans";color:#eef2f8}
.bars{position:absolute;right:0;top:4px;display:flex;gap:10px;align-items:flex-end;height:60px}
.bars i{display:block;width:16px;border-radius:4px 4px 0 0}
</style></head><body><div class="grid"></div><div class="glow"></div><div class="in">

<div class="bars"><i style="height:60px;background:#c98500"></i><i style="height:52px;background:#3987e5"></i><i style="height:46px;background:#2fb3b5"></i><i style="height:40px;background:#9085e9"></i><i style="height:33px;background:#d55181"></i></div>
<p class="eyebrow">Independent decision-model benchmark</p>
<h1>Every decision model, measured the same way.</h1><p class="sub">Accuracy, calibration, speed and cost on frozen data, with identical requests.</p>
<div class="chips"><span class="chip">16 text datasets</span><span class="chip">6 image datasets</span><span class="chip">English · French · Arabic</span></div>
<div class="url">systemonebench.dev</div>
</div></body></html>
