# Publishes the results site to GitHub Pages whenever results.json or the site changes on main.
name: Publish results site

on:
  push:
    branches: [main]
    paths: [results.json, "site/**", .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp site/* _site/
          cp results.json _site/
          python3 -c "import json; json.load(open('_site/results.json')); json.load(open('_site/meta.json'))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
